<section class="section-sm">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <h1 class="h2">{{ .Title }}</h1>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb bg-transparent p-0">
            <li class="breadcrumb-item"><a class="text-dark" href="{{ site.BaseURL }}">{{ site.Params.home }}</a></li>
            
            {{/* Check if there is a parent section and it's not the home page */}}
            {{ if and .Parent (not .Parent.IsHome) }}
            <li class="breadcrumb-item"><a class="text-dark" href="{{ .Parent.Permalink }}">{{ .Parent.Title }}</a></li>
            {{ end }}

            <li class="breadcrumb-item active" aria-current="page">{{ .Title }}</li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
</section>
