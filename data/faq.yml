faqItem:
  - title : "What types of fluids can your gear pumps handle?"
    content : "Our industrial gear pumps are designed to handle a wide variety of fluids, from low-viscosity solvents to extremely high-viscosity materials like asphalt, resins, polymers, and adhesives. We also offer specialized pumps for high-temperature and corrosive environments."

  - title : "Do you offer custom-designed pumping solutions?"
    content : "We specialize in the manufacturing of high-quality, standardized industrial pumps. While we do not offer custom-designed pumps from scratch, our extensive catalog covers a wide range of specifications, materials, and configurations to meet almost any standard industrial application."

  - title : "What is the typical lead time for an order?"
    content : "Since we focus on standardized manufacturing, many of our most popular pump models are kept in stock and can be shipped within 3-5 business days. For larger volume orders or less common specifications, the lead time is typically 2-4 weeks. We will provide an exact timeline with your formal quotation."

  - title : "What kind of warranty do you provide?"
    content : "We stand behind the quality of our equipment. All BuyGearPump products come with a standard 12-month manufacturer's warranty against defects in materials and workmanship, starting from the date of shipment. Extended warranties are also available upon request."

  - title : "Do you ship internationally?"
    content : "Absolutely. We have extensive experience exporting our industrial pumps worldwide. We can arrange shipping via sea freight or air freight depending on your urgency, and we support standard incoterms such as FOB, CIF, and EXW to meet your logistical needs."